# Produção — portas só em loopback; Nginx do host faz TLS (pcoordenador.com.br).
# Uso: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: piloto_apoio_db
    environment:
      POSTGRES_USER: piloto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: piloto_apoio_v2
    volumes:
      - piloto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piloto -d piloto_apoio_v2"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: piloto_apoio_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3333:3333"
    environment:
      DATABASE_URL: postgresql://piloto:${POSTGRES_PASSWORD}@db:5432/piloto_apoio_v2?schema=public
      PORT: "3333"
      HOST: "0.0.0.0"
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: piloto
      CORS_ORIGINS: https://pcoordenador.com.br,https://www.pcoordenador.com.br
      JWT_SECRET: ${JWT_SECRET}
      SCHEDULE_ENGINE_VERSION: CLEAN
    restart: unless-stopped

  admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: piloto_apoio_admin
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  piloto_pg_data:
