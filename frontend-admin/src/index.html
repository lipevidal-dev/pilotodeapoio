<!doctype html>
<html lang="pt-BR">
  <head>
    <script id="block-admin-url">
      (function () {
        var path = location.pathname || '/';
        if (path.length > 1 && path.charAt(path.length - 1) === '/') path = path.slice(0, -1);
        if (path === '/login' || path === '/portal' || path.indexOf('/portal/') === 0) return;
        var raw = null;
        try {
          raw = sessionStorage.getItem('escala_auth_user') || localStorage.getItem('escala_auth_user');
        } catch (e) {}
        var role = '';
        if (raw) {
          try { role = String(JSON.parse(raw).role || ''); } catch (e) {}
        }
        if (role === 'ADMIN') return;
        location.replace(role === 'OPERATOR' || role === 'PILOT' ? '/portal/escala' : '/login');
      })();
    </script>
    <script id="block-login-enter">
      (function () {
        document.addEventListener('click', function (e) {
          var el = e.target;
          if (!el || !el.closest) return;
          var btn = el.closest('form.login-form button');
          if (!btn) return;
          var form = btn.closest('form');
          if (form) form.setAttribute('data-allow-submit', '1');
        }, true);
        document.addEventListener('submit', function (e) {
          var form = e.target;
          if (!form || !form.classList || !form.classList.contains('login-form')) return;
          if (form.getAttribute('data-allow-submit') === '1') {
            form.removeAttribute('data-allow-submit');
            return;
          }
          e.preventDefault();
          e.stopImmediatePropagation();
        }, true);
      })();
    </script>
    <meta charset="utf-8" />
    <title>Escala Piloto de Apoio v2 — Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
